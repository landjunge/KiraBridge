# Merge the following capabilities into the EXISTING principals; do not discard
# their current capabilities, roots, agents or limits:
#
# local:   team.manage, team.read, team.write
# chatgpt: team.read, team.write  (team.manage only if it may create teams)
# each automatic worker: team.read, team.write, agent.execute, task.read
#
# Every automatic worker must be an existing authenticated principal with
# approval_mode="automatic", its OWN agent in its agents allowlist, and the
# fixed cwd in its roots. Example selected token environment NAMES only:
# Set team_only_execution=true on worker principals whose agent.execute grant
# is exclusively for sealed team assignments, preserving private owner boundaries.
# codex -> KIRABRIDGE_CODEX_TOKEN, grok -> KIRABRIDGE_GROK_TOKEN,
# opencode -> KIRABRIDGE_OPENCODE_TOKEN. Use existing credentials where present.
# Do not grant one worker the other workers' provider credentials or agents.
#
# Selecting chatgpt as coordinator is a team role change (team_set_role), not a
# configuration change and not a new program/account permission.
