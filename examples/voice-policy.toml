# Merge into the existing private configuration, preserving permissions and credentials.
# Add this key to the existing Eve section; do not duplicate the table.
[principals.grok_app]
automatic_operations = ["session.input"]

# The old terminal-input buffer is optional legacy behavior, disabled for Daniel.
[session_input_policy]
enabled = false
principals = []
timeout_seconds = 60

# Only authenticated grok_app (Eve) and chatgpt (Kira) use the message outbox.
[voice_messaging]
timeout_seconds = 60

[voice_channel]
enabled = true
conversation_id = "eve-kira-shared"
