name: macOS package acceptance
on:
  push:
    branches: ['release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            runner: '["kirabridge-macos-intel"]'
          - os: macos-15
            runner: '["macos-15"]'
    if: >-
      github.repository == 'landjunge/KiraBridge' &&
      github.actor == 'landjunge' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'landjunge'))
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      UV_PYTHON: '3.11'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify isolated Intel macOS identity before any tests
        if: ${{ matrix.os == 'macos-15-intel' }}
        run: /usr/local/bin/python3.11 scripts/check_macos_ci_host.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: ${{ matrix.os == 'macos-15' }}
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.6'
      - run: uv sync --locked --dev
      - name: Build twice and compare all artifact hashes
        run: |
          uv run python scripts/build_release.py --out dist/candidate
          uv run python scripts/build_release.py --out dist/rebuild
          diff dist/candidate/SHA256SUMS dist/rebuild/SHA256SUMS
      - name: Download authenticated original RC14 upgrade fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/previous
          gh release download v0.8.0rc14 -R landjunge/KiraBridge -p '*.whl' -D dist/previous
          echo 'c5d33839b70badf36371d1fef03ea3a4370e00165db4699647ccacfa3700fadd  dist/previous/kirabridge-0.8.0rc14-py3-none-any.whl' | shasum -a 256 -c -
      - name: Actual isolated launchd install, upgrade, restart and rollback
        run: >-
          uv run python scripts/accept_macos_release.py dist/candidate
          --root dist/accept-ci-rc15
          --previous-wheel dist/previous/kirabridge-0.8.0rc14-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KiraBridge-macos-${{ matrix.os }}
          path: |
            dist/candidate/
            dist/accept-ci-rc15/evidence.json
          retention-days: 14
