name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: '["self-hosted","Linux","X64","kirabridge","debian"]'
            python: '3.11'
          - os: ubuntu-24.04
            runner: '["self-hosted","Linux","X64","kirabridge","debian"]'
            python: '3.13'
          - os: macos-15-intel
            runner: '["kirabridge-macos-intel"]'
            python: '3.11'
          - os: macos-15
            runner: '["macos-15"]'
            python: '3.11'
    # Defense in depth; repository-level fork workflow execution must stay disabled.
    if: >-
      github.repository == 'landjunge/KiraBridge' &&
      github.actor == 'landjunge' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'landjunge'))
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify isolated Intel macOS identity before any tests
        if: ${{ matrix.os == 'macos-15-intel' }}
        run: /usr/local/bin/python3.11 scripts/check_macos_ci_host.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ matrix.os == 'macos-15' }}
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.6'
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Check out fixed reviewed ThreadDesk source for the actual MCP roundtrip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landjunge/threaddesk
          ref: 770bbc9f0c0a02699cc93cad47d2e2c3782f7080
          path: .ci-threaddesk
          persist-credentials: false
      - name: Check out fixed reviewed TollGate stop-only journal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: landjunge/tollgate
          ref: 53fc57cc2e082d022e65e5929cb2a1e186fba852
          path: .ci-tollgate
          persist-credentials: false
      - run: uv run pytest -q -W error::pytest.PytestUnraisableExceptionWarning
        env:
          KIRABRIDGE_TEST_THREADDESK_SOURCE: ${{ github.workspace }}/.ci-threaddesk/src
          KIRABRIDGE_TEST_TOLLGATE_SOURCE: ${{ github.workspace }}/.ci-tollgate
      - run: uv build
