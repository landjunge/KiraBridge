<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiraBridge · Freigaben</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><div><span class="eyebrow">AUF DIESEM MAC</span><h1>KiraBridge</h1><p>Aufträge und ihre Ergebnisse verfolgen.</p></div><button id="refresh" type="button">Aktualisieren</button></header>
    <p id="approval-mode" role="status"></p>
    <p id="message" role="status">Verbindung wird geprüft …</p>
    <section><h2>Freigaben <span id="count">0</span></h2><div id="pending"></div></section>

    <footer>Der eingerichtete Freigabemodus gilt je Zugang. Ein empfangener Auftrag ist noch kein Ausführungsnachweis.</footer>
  </main>
