<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiraBridge Live</title>
<link rel="stylesheet" href="/networkpunkt.css">
<link rel="stylesheet" href="/live.css">
<script src="/live.js" defer></script>
</head>
<body class="np-ui live">
<main class="live-shell">
  <header class="live-head">
    <h1>KiraBridge Live</h1>
    <span class="live-observed" id="live-observed" aria-live="polite">…</span>
  </header>
  <p class="live-hint" id="live-hint" role="status"></p>
  <ul class="live-list" id="live-list" aria-live="polite"></ul>
  <p class="live-scope" id="live-scope">Nur lesende Live-Anzeige aus der vorhandenen Beobachtung. Kein Archiv, keine Rohlogs, keine erfundenen Prozentwerte; ein laufender Prozess ist keine bestätigte Facharbeit.</p>
</main>
</body>
</html>
